<section style="background: #f7fafc; border-left: 4px solid #667eea; border-radius: 10px; padding: 25px; margin-bottom: 30px;">
    <h2>🛒 当前产品</h2>
    {% if current_order %}
    <p style="margin-top: 12px;"><strong>{{ current_order.product_name }}</strong></p>
    <p style="margin-top: 8px; color: #4a5568;">购买价格：¥{{ '%g'|format(current_order.price) }}</p>
    {% if usage_info %}
    <p style="margin-top: 8px; color: #4a5568;">到期时间：{{ usage_info.expiry_date }}</p>
    <p style="margin-top: 4px; color: #4a5568;">剩余流量：{{ usage_info.remaining_traffic }}</p>
    {% endif %}
    {% else %}
    <p style="margin-top: 12px; color: #4a5568;">您还没有购买产品。<a href="{{ url_for('purchase') }}">去购买</a></p>
    {% endif %}
    <p style="margin-top: 8px; color: #718096;">购买其他产品后，当前产品将被替换。</p>
</section>
