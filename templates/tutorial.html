{% extends "base.html" %}

{% block title %}教程 - Web3X{% endblock %}

{% block extra_css %}
<style>
    .tutorial-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
    }

    .tutorial-btn {
        padding: 8px 16px;
        border: 2px solid #cbd5e0;
        background: white;
        color: #4a5568;
        border-radius: 5px;
        text-decoration: none;
    }

    .tutorial-btn:hover,
    .tutorial-btn:focus-visible {
        border-color: #667eea;
        color: #667eea;
    }

    .tutorial-btn.active {
        background: #667eea;
        color: white;
        border-color: #667eea;
    }

    .tutorial-card {
        display: block;
        max-width: 640px;
        margin-top: 20px;
        padding: 24px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
    }

    .tutorial-card h2 {
        margin-bottom: 12px;
        font-size: 20px;
    }

    .tutorial-link {
        color: #4c51bf;
        text-underline-offset: 3px;
    }
</style>
{% endblock %}

{% block content %}
<h1>教程</h1>
{% set mac_selected = request.args.get('category') == 'mac' %}
<nav class="tutorial-buttons" aria-label="教程分类">
    <a class="tutorial-btn{% if not mac_selected %} active{% endif %}" href="{{ url_for('tutorial') }}"
       {% if not mac_selected %}aria-current="page"{% endif %}>全部</a>
    <a class="tutorial-btn{% if mac_selected %} active{% endif %}" href="{{ url_for('tutorial', category='mac') }}"
       {% if mac_selected %}aria-current="page"{% endif %}>Mac</a>
</nav>
<section class="tutorial-card">
    <h2><a class="tutorial-link" href="{{ url_for('mac_tutorial') }}">FlClash macOS 使用教程</a></h2>
    <p>安装 FlClash、导入订阅并测试连接。</p>
</section>
{% endblock %}
